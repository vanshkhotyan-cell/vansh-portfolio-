<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="vkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="vkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#vkBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  <rect x="4" y="4" width="92" height="92" rx="22" fill="none" stroke="url(#vkGrad)" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Monogram geometry: V and K interwoven -->
  <g filter="url(#glow)">
    <!-- V glyph -->
    <path d="M 24 30 L 38 68 L 47 44" fill="none" stroke="#22D3EE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- K stem -->
    <path d="M 54 30 L 54 70" fill="none" stroke="#E6EDF7" stroke-width="5" stroke-linecap="round" />
    <!-- K arms -->
    <path d="M 74 34 L 54 51 L 76 68" fill="none" stroke="url(#vkGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Glowing core data dot -->
    <circle cx="54" cy="51" r="3.5" fill="#22D3EE" />
  </g>
</svg>